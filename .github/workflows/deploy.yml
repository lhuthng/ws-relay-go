name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.22"
  APP_NAME: ws-relay-go
  REMOTE_PATH: /usr/local/bin/ws-relay-go
  SERVICE_NAME: ws-relay-go

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests
        run: go test ./...

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Linux binary
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" -o "dist/${APP_NAME}" .

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.HOST }}" >> ~/.ssh/known_hosts

      - name: Upload binary
        run: |
          scp "dist/${APP_NAME}" "${{ secrets.USER }}@${{ secrets.HOST }}:/tmp/${APP_NAME}"

      - name: Install and restart service
        run: |
          ssh "${{ secrets.USER }}@${{ secrets.HOST }}" \
            "sudo install -m 0755 /tmp/${APP_NAME} ${REMOTE_PATH} && sudo systemctl restart ${SERVICE_NAME}"
